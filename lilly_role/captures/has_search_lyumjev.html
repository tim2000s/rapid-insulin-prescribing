<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <title>Accès protégé</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <style>
      :root {
        --bg: #f0f0f0;
        --card: #ffffff;
        --text: #0a0a0a;
        --text-muted: #333333;
        --shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        --radius: 16px;
        --gap: 16px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #303030;
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial,
          "Noto Sans",
          sans-serif,
          "Apple Color Emoji",
          "Segoe UI Emoji",
          "Segoe UI Symbol",
          "Noto Color Emoji";
        background: var(--bg);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      @supports (height: 100dvh) {
        body {
          min-height: 100dvh;
        }
      }

      .page {
        padding: max(16px, env(safe-area-inset-top))
          max(16px, env(safe-area-inset-right))
          max(16px, env(safe-area-inset-bottom))
          max(16px, env(safe-area-inset-left));
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .container {
        width: 100%;
        max-width: 780px;
        background: var(--card);
        padding: 20px;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        text-align: center;
      }

      .logo {
        display: block;
        margin: 0 auto 16px;
        width: 50px;
        height: 50px;
        margin-bottom: 30px;
      }

      .ogo-logo {
        width: 54px;
        position: relative;
        top: 3px;
      }

      .protected-by {
        display: flex;
        align-items: baseline;
        justify-content: center;
        width: 100%;
        gap: 6px;
      }

      #isProtectedBy {
        margin: 0;
      }

      h1 {
        font-size: clamp(1.25rem, 3.8vw, 1.75rem);
        line-height: 1.2;
        margin: 0 0 8px;
        color: var(--text-muted);
      }

      p {
        margin: 0 0 16px;
        color: var(--text);
        font-size: clamp(0.95rem, 3.5vw, 1rem);
      }

      iframe {
        width: 100%;
        border: none;
      }

      .why {
        margin-top: 16px;
        font-size: clamp(0.9rem, 3.2vw, 1rem);
      }

      a {
        color: #2f6feb;
        text-decoration: none;
      }
      a:focus,
      a:hover {
        text-decoration: underline;
      }

      @media (min-width: 600px) {
        .container {
          padding: 28px;
        }
        .why {
          margin-top: 36px;
        }
      }

      @media (min-width: 992px) {
        .container {
          padding: 32px;
        }
        .why {
          margin-top: 40px;
        }
      }

      #title {
        margin: 20px 0 20px 0;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="page" style="background-color: #f0f0f0;">
      <div class="container" role="main" aria-labelledby="title">
        <div class="header">
          <div style="text-align:center;font-family:&#39;system-ui&#39; , sans-serif"><h1 style="margin:20px 0;color:#333333">www.has-sante.fr</h1><div></div></div>
        </div>
        <iframe
          src="/.well-known/ogo-challenge/page?difficulty=C2"
        ></iframe>
        <div class="footer">
          <div style="text-align:center;margin-top:36px;font-family:&#39;system-ui&#39; , sans-serif"><p style="color:#9ca3af;font-size:0.8rem;margin:0 0 16px">Cette page nous aide à prouver que vous n&#39;êtes pas un robot.</p><a href="https://www.ogosecurity.com" style="color:#2f6feb;text-decoration:none" >OGO Security</a></div>
        </div>
        <noscript>
          <div class="h2" role="alert">
            <span id="noscript-text"
              >Please enable JavaScript and cookies to continue.</span
            >
          </div>
        </noscript>
      </div>
    </div>
  </body>
  <script>
    (function () {
      const lang = (
        navigator.language ||
        navigator.userLanguage ||
        "en"
      ).toLowerCase();
      const isFR = lang.startsWith("fr");

      const texts = {
        fr: {
          htmlLang: "fr",
          isProtectedBy: "Ce site est protégé par",
          why: "Cette page nous aide à prouver que vous n'êtes pas un robot.",
          pageTitle: "Accès protégé",
        },
        en: {
          htmlLang: "en",
          isProtectedBy: "This site is protected by",
          why: "This page helps us verify that you are not a robot.",
          pageTitle: "Protected access",
        },
      };

      const t = isFR ? texts.fr : texts.en;

      document.documentElement.lang = t.htmlLang;
      document.title = t.pageTitle;

      document.getElementById("isProtectedBy").textContent = t.isProtectedBy;
      document.getElementById("why-text").textContent = t.why;
    })();
  </script>
</html>
